version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ontexus
      POSTGRES_USER: ontexus
      POSTGRES_PASSWORD: ontexus
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/scripts/postgres-initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.20-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/ontexus123
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [minio_data:/data]
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.20
    ports: ["8001:8000"]
    volumes: [chroma_data:/chroma/chroma]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes: [./backend:/app]
    command: /bin/sh -c "python scripts/verify_build_manifest.py --manifest /manifests/agent.json --alembic-dir /app/alembic && exec python scripts/guarded_entrypoint.py -- python scripts/run_migrations.py upgrade head"

  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    # In-network clients use the container port, not the host's 8001 mapping.
    environment: &chroma-environment
      CHROMA_PORT: "8000"
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes: [./backend:/app, ./uploads:/uploads]
    command: /bin/sh -c "python scripts/verify_build_manifest.py --manifest /manifests/agent.json --alembic-dir /app/alembic && exec python scripts/guarded_entrypoint.py -- python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Task 6A: explicit queue-bound worker profiles. The default `docker
  # compose up` (no --profile) starts none of these — each is gated behind
  # its own profile so a plain v2 dev-up stays lightweight; enable with
  # `--profile refresh` / `--profile artifact` / `--profile agent` /
  # `--profile housekeeping` (or several at once). `celery_beat` below stays
  # unprofiled since it only ever publishes/schedules, never consumes.
  refresh_schedule_worker:
    build: ./backend
    env_file: .env
    profiles: ["refresh"]
    environment:
      <<: *chroma-environment
      REFRESH_WORKER_CONCURRENCY: ${REFRESH_WORKER_CONCURRENCY:-2}
      REFRESH_WORKER_PREFETCH_MULTIPLIER: ${REFRESH_WORKER_PREFETCH_MULTIPLIER:-1}
      REFRESH_SOFT_TIME_LIMIT_SECONDS: ${REFRESH_SOFT_TIME_LIMIT_SECONDS:-300}
      REFRESH_HARD_TIME_LIMIT_SECONDS: ${REFRESH_HARD_TIME_LIMIT_SECONDS:-360}
      REFRESH_WORKER_SHUTDOWN_GRACE_SECONDS: ${REFRESH_WORKER_SHUTDOWN_GRACE_SECONDS:-40}
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes: [./backend:/app, ./uploads:/uploads]
    stop_grace_period: ${REFRESH_WORKER_SHUTDOWN_GRACE_SECONDS:-40}s
    command: /bin/sh -c "python scripts/verify_build_manifest.py --manifest /manifests/agent.json --alembic-dir /app/alembic && exec python scripts/guarded_entrypoint.py -- python -m celery -A app.tasks.celery_app worker --loglevel=info -Q refresh.schedule --concurrency=${REFRESH_WORKER_CONCURRENCY:-2} --prefetch-multiplier=1"

  refresh_poll_worker:
    build: ./backend
    env_file: .env
    profiles: ["refresh"]
    environment:
      <<: *chroma-environment
      REFRESH_WORKER_CONCURRENCY: ${REFRESH_WORKER_CONCURRENCY:-2}
      REFRESH_WORKER_PREFETCH_MULTIPLIER: ${REFRESH_WORKER_PREFETCH_MULTIPLIER:-1}
      REFRESH_SOFT_TIME_LIMIT_SECONDS: ${REFRESH_SOFT_TIME_LIMIT_SECONDS:-300}
      REFRESH_HARD_TIME_LIMIT_SECONDS: ${REFRESH_HARD_TIME_LIMIT_SECONDS:-360}
      REFRESH_WORKER_SHUTDOWN_GRACE_SECONDS: ${REFRESH_WORKER_SHUTDOWN_GRACE_SECONDS:-40}
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes: [./backend:/app, ./uploads:/uploads]
    stop_grace_period: ${REFRESH_WORKER_SHUTDOWN_GRACE_SECONDS:-40}s
    command: /bin/sh -c "python scripts/verify_build_manifest.py --manifest /manifests/agent.json --alembic-dir /app/alembic && exec python scripts/guarded_entrypoint.py -- python -m celery -A app.tasks.celery_app worker --loglevel=info -Q refresh.poll --concurrency=${REFRESH_WORKER_CONCURRENCY:-2} --prefetch-multiplier=1"

  refresh_event_worker:
    build: ./backend
    env_file: .env
    profiles: ["refresh"]
    environment:
      <<: *chroma-environment
      REFRESH_WORKER_CONCURRENCY: ${REFRESH_WORKER_CONCURRENCY:-2}
      REFRESH_WORKER_PREFETCH_MULTIPLIER: ${REFRESH_WORKER_PREFETCH_MULTIPLIER:-1}
      REFRESH_SOFT_TIME_LIMIT_SECONDS: ${REFRESH_SOFT_TIME_LIMIT_SECONDS:-300}
      REFRESH_HARD_TIME_LIMIT_SECONDS: ${REFRESH_HARD_TIME_LIMIT_SECONDS:-360}
      REFRESH_WORKER_SHUTDOWN_GRACE_SECONDS: ${REFRESH_WORKER_SHUTDOWN_GRACE_SECONDS:-40}
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes: [./backend:/app, ./uploads:/uploads]
    stop_grace_period: ${REFRESH_WORKER_SHUTDOWN_GRACE_SECONDS:-40}s
    command: /bin/sh -c "python scripts/verify_build_manifest.py --manifest /manifests/agent.json --alembic-dir /app/alembic && exec python scripts/guarded_entrypoint.py -- python -m celery -A app.tasks.celery_app worker --loglevel=info -Q refresh.event --concurrency=${REFRESH_WORKER_CONCURRENCY:-2} --prefetch-multiplier=1"

  refresh_replay_worker:
    build: ./backend
    env_file: .env
    profiles: ["refresh"]
    environment:
      <<: *chroma-environment
      REFRESH_WORKER_CONCURRENCY: ${REFRESH_WORKER_CONCURRENCY:-2}
      REFRESH_WORKER_PREFETCH_MULTIPLIER: ${REFRESH_WORKER_PREFETCH_MULTIPLIER:-1}
      REFRESH_SOFT_TIME_LIMIT_SECONDS: ${REFRESH_SOFT_TIME_LIMIT_SECONDS:-300}
      REFRESH_HARD_TIME_LIMIT_SECONDS: ${REFRESH_HARD_TIME_LIMIT_SECONDS:-360}
      REFRESH_WORKER_SHUTDOWN_GRACE_SECONDS: ${REFRESH_WORKER_SHUTDOWN_GRACE_SECONDS:-40}
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes: [./backend:/app, ./uploads:/uploads]
    stop_grace_period: ${REFRESH_WORKER_SHUTDOWN_GRACE_SECONDS:-40}s
    command: /bin/sh -c "python scripts/verify_build_manifest.py --manifest /manifests/agent.json --alembic-dir /app/alembic && exec python scripts/guarded_entrypoint.py -- python -m celery -A app.tasks.celery_app worker --loglevel=info -Q refresh.replay --concurrency=${REFRESH_WORKER_CONCURRENCY:-2} --prefetch-multiplier=1"

  artifact_worker:
    build: ./backend
    env_file: .env
    profiles: ["artifact"]
    environment: *chroma-environment
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes: [./backend:/app, ./uploads:/uploads]
    command: /bin/sh -c "python scripts/verify_build_manifest.py --manifest /manifests/agent.json --alembic-dir /app/alembic && exec python scripts/guarded_entrypoint.py -- python -m celery -A app.tasks.celery_app worker --loglevel=info -Q artifact.extraction --prefetch-multiplier=1"

  agent_worker:
    build: ./backend
    env_file: .env
    profiles: ["agent"]
    environment: *chroma-environment
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes: [./backend:/app, ./uploads:/uploads, ./test_data:/test_data:ro]
    command: /bin/sh -c "python scripts/verify_build_manifest.py --manifest /manifests/agent.json --alembic-dir /app/alembic && exec python scripts/guarded_entrypoint.py -- python -m celery -A app.tasks.celery_app worker --loglevel=info -Q agent.interactive --prefetch-multiplier=1"

  housekeeping_worker:
    build: ./backend
    env_file: .env
    profiles: ["housekeeping"]
    environment: *chroma-environment
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes: [./backend:/app, ./uploads:/uploads]
    command: /bin/sh -c "python scripts/verify_build_manifest.py --manifest /manifests/agent.json --alembic-dir /app/alembic && exec python scripts/guarded_entrypoint.py -- python -m celery -A app.tasks.celery_app worker --loglevel=info -Q housekeeping --prefetch-multiplier=1"

  celery_beat:
    build: ./backend
    env_file: .env
    environment: *chroma-environment
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    volumes: [./backend:/app, ./uploads:/uploads]
    command: /bin/sh -c "python scripts/verify_build_manifest.py --manifest /manifests/agent.json --alembic-dir /app/alembic && exec python scripts/guarded_entrypoint.py -- python -m celery -A app.tasks.celery_app beat --loglevel=info"

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on: [backend]
    volumes: [./frontend:/app, /app/node_modules]
    command: npm run dev -- --host

volumes:
  pg_data:
  neo4j_data:
  minio_data:
  chroma_data:
